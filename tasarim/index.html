<!-- tekrar, asistan, arama, ses, izler ve cizgi.css açılışta yüklenmez: modülleri ortak.js stilYukle() ile bu sıraya ekler -->
<script>
  // Kayıtlı tema, atmosfer ve sade hareket ilk boyamadan önce uygulanır, açılışta renk sıçraması olmaz.
  // 7.0 (TASARIM-5 4.1 madde 5): çözülmüş kip, etkin atmosfer (yalnız gece olanın gündüz eşi; ortak.js etkinAtmosfer ile
  // aynı eşleme), vurgu, canlı zemin ve tarayıcı çubuğu rengi. app.js açılınca aynı nitelikleri yeniden yazar.
  (function () {
    var k = document.documentElement, a = null;
    try { a = JSON.parse(localStorage.getItem("kn-tasarim:ayarlar") || "null"); } catch (e) { /* gizli pencere: varsayılanlar */ }
    // Kayıt hiç yoksa yeni kurulum: Lapis (ortak.js YENI_KURULUM ile aynı). Kaydı olup atmosferi olmayan eski kullanıcı Aurora
    var yeni = !(a && typeof a === "object");
    a = a && typeof a === "object" ? a : {};
    if (a.tema === "acik") k.dataset.theme = "light";
    if (a.tema === "koyu") k.dataset.theme = "dark";
    if (a.sadeHareket) k.dataset.hareket = "sade";
    // Rahat kullanım: yazı boyutu, yüksek kontrast ve renk körü görünümü de ilk boyamada (app.js aynılarını yazar)
    if (a.arayuzYazi === "buyuk" || a.arayuzYazi === "kucuk") k.dataset.yazi = a.arayuzYazi;
    if (a.yuksekKontrast) k.dataset.kontrast = "yuksek";
    if (a.renkKoru) k.dataset.renkKoru = "";
    if (a.okunakliArayuz) k.dataset.okunakli = "";   // okunaklı arayüz yazısı (Atkinson), açılışta Inter'den sıçramasın
    if (a.elYazisi === false) k.dataset.notYazi = "duz";
    // Android kabuğu açılışı kendisi oynattı (android-kabuk acilis_lamba.xml): #acilis yanık lambayla başlar, beklemez
    if (window.LuxYerel) k.dataset.yerelAcilis = "";
    var gece = a.tema === "koyu" || (a.tema !== "acik" && matchMedia("(prefers-color-scheme: dark)").matches);
    var R = { lapis: ["#F3EBDB", "#0E1838"], aurora: ["#F4F5F9", "#0B0C11"], nebula: ["#F6F3FC", "#0D0A16"], okyanus: ["#F2F7F8", "#071216"], grafit: ["#F3F3F4", "#0E0E10"],
      oled: ["#F3F3F4", "#000000"], kagit: ["#F7F5F0", "#141413"], "sepya-gece": ["#F7F5F0", "#15110C"], orman: ["#F2F5F0", "#0A110C"] };
    var ES = { oled: "grafit", "sepya-gece": "kagit" };
    var VURGU = ["altin", "iris", "lagun", "zumrut", "kehribar", "mercan", "gul", "gok", "gumus"];
    var secim = R.hasOwnProperty(a.atmosfer) ? a.atmosfer : yeni ? "lapis" : "aurora";
    k.dataset.kip = gece ? "gece" : "gunduz";
    k.dataset.atmosfer = !gece && ES[secim] ? ES[secim] : secim;
    if (VURGU.indexOf(a.vurgu) >= 0) k.dataset.vurgu = a.vurgu;
    if (a.canliZemin && !a.sadeHareket && !matchMedia("(prefers-reduced-motion: reduce)").matches) k.dataset.canliZemin = "";
    // Açılış ekranı (#acilis) ve tarayıcı çubuğu, seçilen atmosferin GECE rengini alır (R[secim][1]). Gece rengi bilinçli:
    // açılış işareti ve sloganı koyu zemin için çizildi, gündüz kipinde de okunur kalır. Yazılamazsa #acilis CSS yedeği
    // (#0E1838) ve meta kalır. Kabuk kurulunca app.js temaRengi() çubuğu kipin rengine düzeltir.
    // manifest.webmanifest tek değer taşır (theme_color, background_color #0E1838): soğuk açılışın sistem splash'i atmosfere uymaz.
    try {
      var z = R[secim][1], m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", z);
      k.style.setProperty("--acilis-zemin", z);
    } catch (e) { /* yedek renkler kalır */ }
  })();

  // Açılış ekranı ve açılış hatası. app.js açılış adımlarını bitirince knUygulamaHazir(), ilk ekran çizilince
  // knAcilisBitti() çağırır (#acilis söner). Hazır olmadan yakalanmamış bir hata olur ve uygulama 4 saniye içinde yine de
  // hazır olmazsa açılış ölümcül sayılır: #acilis "Bir şey ters gitti" ekranına döner (Yenile, Tanı bilgisini kopyala).
  // Hazır olduktan sonraki hatalar buraya gelmez; açılış sürerken olup uygulamayı durdurmayan hata da ekran açtırmaz.
  // Modüller hiç yüklenmeyebilir, bu yüzden metinler t() ile değil burada iki dilde (dil.js dilBul ile aynı seçim).
  (function () {
    var hazir = false, bekle = 0, ilk = null;
    function ingilizce() {
      try { var d = localStorage.getItem("kn-dil"); if (d === "tr" || d === "en") return d === "en"; } catch (e) { /* gizli pencere */ }
      return String((navigator.languages && navigator.languages[0]) || navigator.language || "tr").toLowerCase().indexOf("tr") !== 0;
    }
    function tani() {
      var h = ilk && ilk.hata, sw = navigator.serviceWorker && navigator.serviceWorker.controller;
      return ["Luxmente", new Date().toISOString(), location.pathname, navigator.userAgent, "SW: " + (sw ? "var" : "yok"),
        (ilk ? ilk.kaynak + ": " : "") + String(h && h.message || h), h && h.stack ? String(h.stack) : ""].join("\n").trim();
    }
    function goster() {
      var el = document.getElementById("acilis");
      if (hazir || !el) return;
      var en = ingilizce(), M = en
        ? ["Something went wrong", "Luxmente couldn’t start. Your notes and books are safe on this device; reloading usually fixes it.", "Reload", "Copy diagnostic info", "Copied"]
        : ["Bir şey ters gitti", "Luxmente açılamadı. Notların ve kitapların bu cihazda duruyor; yenilemek çoğu zaman yeter.", "Yenile", "Tanı bilgisini kopyala", "Kopyalandı"];
      var b = document.createElement("h1"), p = document.createElement("p"), yenile = document.createElement("button"), kopyala = document.createElement("button"), alt = document.createElement("div");
      b.textContent = M[0]; p.textContent = M[1]; yenile.textContent = M[2]; kopyala.textContent = M[3];
      yenile.type = kopyala.type = "button";
      yenile.className = "birincil";
      yenile.onclick = function () { location.reload(); };
      kopyala.onclick = function () {
        var metin = tani(), bitti = function () { kopyala.textContent = M[4]; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(metin).then(bitti, elle);
        else elle();
        // Pano yoksa (güvenli olmayan bağlantı) metin seçili bir kutuda gösterilir, elle kopyalanır
        function elle() { var k = document.createElement("textarea"); k.readOnly = true; k.value = metin; alt.after(k); k.select(); }
      };
      alt.className = "acilis__eylem";
      alt.append(yenile, kopyala);
      el.replaceChildren(b, p, alt);
      el.className = "hata";
      el.setAttribute("role", "alert");
      el.removeAttribute("aria-hidden");
      yenile.focus();
    }
    window.knAcilisHata = function (hata, kaynak) {
      if (hazir) return;
      ilk = ilk || { hata: hata, kaynak: kaynak || "hata" };   // ilk hata çoğu zaman asıl neden
      clearTimeout(bekle);
      bekle = setTimeout(goster, 4000);
    };
    window.knUygulamaHazir = function () { hazir = true; clearTimeout(bekle); };
    // "Lamba yanar" açılışı (aşağıdaki #acilis CSS'i) ~0,76 saniyede lamba yanmış, ışık halkayı dolaşmış olur. Uygulama daha
    // erken hazırsa perde o ana kadar bekler, sonra söner (en çok 0,76 sn; yavaş açılışta hiç beklenmez). Sade hareket,
    // azaltılmış hareket ve Android kabuğu (canlı açılışı kabuk oynattı, data-yerel-acilis) beklemez, yalnız söner.
    var bitiyor = false;
    window.knAcilisBitti = function () {
      window.knUygulamaHazir();
      var el = document.getElementById("acilis");
      if (!el || bitiyor) return;
      // Hata ekranı açıldıktan sonra uygulama yine de hazır oldu (yavaş cihazda açılış 4 saniyeyi aştı, hata zararsızdı):
      // ekran çalışan uygulamanın önünde kalmasın
      if (el.classList.contains("hata")) {
        // Odak Yenile düğmesindeyse kaldırılınca body'ye düşer (ekran okuyucu bağlamı yitirir): ana alana taşınır
        var m = document.getElementById("sahne");
        if (m && el.contains(document.activeElement)) { m.setAttribute("tabindex", "-1"); try { m.focus({ preventScroll: true }); } catch (e) { /* odak verilemedi */ } }
        el.remove(); return;
      }
      bitiyor = true;
      var k = document.documentElement.dataset;
      var canli = k.hareket !== "sade" && k.yerelAcilis === undefined && !matchMedia("(prefers-reduced-motion: reduce)").matches;
      var kalan = canli && typeof performance !== "undefined" && window.__knAcilisT0 != null ? window.__knAcilisT0 + 760 - performance.now() : 0;
      function son() {
        if (el.classList.contains("hata")) { el.remove(); return; }
        el.classList.add("gidiyor");
        setTimeout(function () { el.remove(); }, 220);
      }
      if (kalan > 0) setTimeout(son, kalan); else son();
    };
    // ResizeObserver döngü uyarısı hata olayı olarak gelir ama zararsızdır
    addEventListener("error", function (e) { if (!/ResizeObserver loop/.test(e.message || "")) window.knAcilisHata(e.error || e.message, "error"); });
    addEventListener("unhandledrejection", function (e) { window.knAcilisHata(e.reason, "unhandledrejection"); });
  })();
</script>
<style>
  /* Açılış ekranı (Luxmente kimliği): gece zemininde Mühürlü Alev (varak halka, krem uç, yanan lamba), fildişi Lux·mente
     (yola çevrilmiş, yazı tipi beklemez; nokta yanan lamba), çift altın çizgi ve lamba sarısı slogan. CSS dosyalarından
     bağımsız; işaret ve kelime işaretini marka-oneri/canli-set.mjs yazar. Hata ekranı da aynı zeminde. */
  #acilis { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px;
    background: var(--acilis-zemin, #0E1838); color: #F6EFE0; text-align: center; transition: opacity .2s ease-out; }
  #acilis.gidiyor { opacity: 0; pointer-events: none; }
  /* İşaret ekranın tam ortasında, 288 px kutuda (Android 12+ açılış simgesiyle aynı yer ve boy: kabuktan sayfaya geçişte
     kıpırdamaz). Kelime işareti, çizgi ve slogan altında. Lambanın ışığı zemine yayılır (::before, lambanın yerinde). */
  #acilis .acilis__isaret { position: absolute; left: 50%; top: 50%; width: 288px; height: 288px; margin: -144px 0 0 -144px; overflow: visible; }
  #acilis::before { content: ""; position: absolute; left: calc(50% + 52.7px - 300px); top: calc(50% - 52.7px - 300px); width: 600px; height: 600px;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(98, 136, 234, .34), rgba(98, 136, 234, .1) 50%, rgba(98, 136, 234, 0)); pointer-events: none; }
  #acilis.hata::before { content: none; }
  #acilis .acilis__marka { position: absolute; left: 0; right: 0; top: calc(50% + 92px); display: grid; justify-items: center; gap: 14px; padding: 0 24px; }
  #acilis .acilis__ad { display: block; width: clamp(176px, 44vw, 232px); height: auto; overflow: visible; }
  #acilis .acilis__cizgi { width: 52px; height: 3px; box-sizing: border-box; border-top: 1px solid #C6A15B; border-bottom: 1px solid rgba(198, 161, 91, .55); }
  #acilis .acilis__slogan { margin: 0; font: italic 300 clamp(15px, 3.4vw, 18px)/1.3 "Newsreader", Georgia, serif; color: #EAD39A; }
  #acilis .acilis__isik { opacity: 0; stroke-dasharray: 18 200; }
  #acilis :is(.acilis__lamba, .acilis__hale) { transform-box: fill-box; transform-origin: center; }
  /* "Lamba yanar" (0,86 sn): işaret belirir, lamba yanar ve ışığı zemine yayılır, ışık halkada lambadan çıkıp dolaşır ve
     lambaya döner; kelime işareti ve slogan gelir. Android 12+ kabuğunda aynı çizelge acilis_lamba.xml'de
     (marka-oneri/canli-acilis.mjs ZAMAN). Sade ve azaltılmış harekette çizelge yok: son hâl görünür, perde yalnız söner. */
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis .acilis__isaret { animation: ac-gel 260ms cubic-bezier(.2, .7, .3, 1) both; }
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis .acilis__lamba { animation: ac-lamba 320ms ease-out 200ms both; }
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis .acilis__hale { animation: ac-hale 380ms ease-out 200ms both; }
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis .acilis__isik { animation: ac-isik 480ms cubic-bezier(.4, 0, .2, 1) 380ms both; }
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis::before { animation: ac-sol 420ms ease-out 240ms both; }
  html:not([data-hareket="sade"]):not([data-yerel-acilis]) #acilis .acilis__marka { animation: ac-sol 380ms ease-out 320ms both; }
  /* Android kabuğu: işaret kabuğun açılışından yanık gelir; ışık ve yazı kısaca belirir */
  html[data-yerel-acilis]:not([data-hareket="sade"]) #acilis::before, html[data-yerel-acilis]:not([data-hareket="sade"]) #acilis .acilis__marka { animation: ac-sol 200ms ease-out both; }
  #acilis .acilis__isik { filter: drop-shadow(0 0 2px rgba(255, 231, 168, .9)); }
  @keyframes ac-gel { from { opacity: 0; transform: scale(.94); } }
  @keyframes ac-lamba { from { opacity: .3; transform: scale(.7); } }
  @keyframes ac-hale { from { opacity: 0; transform: scale(.3); } }
  @keyframes ac-isik { 0% { stroke-dashoffset: 18; opacity: .9; } 100% { stroke-dashoffset: -100; opacity: .9; } }
  @keyframes ac-sol { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #acilis :is(.acilis__isaret, .acilis__lamba, .acilis__hale, .acilis__isik, .acilis__marka), #acilis::before { animation: none !important; } }
  #acilis.hata h1 { margin: 0; font: 400 28px/1.2 "Literata", Georgia, serif; }
  #acilis.hata p { max-width: 420px; margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #B9AF9B; }
  #acilis .acilis__eylem { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  #acilis button { min-height: 44px; padding: 0 18px; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; font: 500 15px system-ui, sans-serif; cursor: pointer; }
  #acilis button.birincil { background: #F6EFE0; color: #0E1838; border-color: transparent; }
  #acilis textarea { width: min(520px, 100%); height: 140px; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
